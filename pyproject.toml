[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anip"
version = "1.0.0"
description = "Automated News Intelligence Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "psycopg2-binary==2.9.9",
    "sqlalchemy==1.4.52",
    "pgvector>=0.4.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.12.0",
    "pydantic-ai>=1.17.0",
    "google-genai",
    "requests>=2.32.5",
    "ddgs>=9.9.1",
    "schedule>=1.2.2",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow==2.10.4",
    "apache-airflow-providers-apache-spark==4.10.0",
    "pyspark==4.0.0",
    "newsapi-python==0.2.7",
]

ml = [
    "mlflow==2.16.0",
    "scikit-learn==1.5.0",
    "numpy==1.26.4",
    "scipy==1.13.0",
]

api = [
    "fastapi>=0.121.2",
    "mlflow>=2.16.0",
    "uvicorn>=0.38.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "aiokafka>=0.12.0",
    "redis>=5.0.1",
    "twilio>=8.5.0",
]

spark = [
    "pyspark==4.0.0",
]

dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "ruff==0.1.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["anip*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

