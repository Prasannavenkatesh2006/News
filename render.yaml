services:
  # Database
  - type: database
    name: anip-db
    databaseName: anip
    user: anip_user
    plan: free # Change to starter or higher if needed

  # Redis
  - type: redis
    name: anip-redis
    plan: free # Change to starter or higher if needed
    ipAllowList: [] # Only allow internal connections

  # Backend (API)
  - type: web
    name: anip-api
    env: docker
    dockerContext: .
    dockerfilePath: services/api/Dockerfile
    plan: free
    healthCheckPath: /health # Verify if this exists in the app
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: anip-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: anip-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: anip-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: anip-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: anip-db
          property: password
      - key: REDIS_URL
        fromRedis:
          name: anip-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_API_KEY
        sync: false 
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false

  # Scrapers (Background Worker)
  - type: worker
    name: anip-scrapers
    env: python
    buildCommand: pip install -r backend/scrapers/requirements.txt
    startCommand: python scripts/render_scraper_runner.py
    plan: free
    envVars:
      - key: API_URL
        fromService:
          name: anip-api
          type: web
          property: url
      - key: AI_BOT_TOKEN
        value: "anip-ai-bot-secret-2024"
      - key: PYTHONPATH
        value: ".:backend/scrapers"

  # Frontend
  - type: web
    name: anip-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: anip-api
          type: web
          property: url
