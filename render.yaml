databases:
  - name: anip-db
    databaseName: anip
    user: anip_user
    plan: free

services:
  # Redis
  - type: redis
    name: anip-redis
    plan: free

  # Backend (API)
  - type: web
    name: anip-api
    env: docker
    dockerContext: .
    dockerfilePath: services/api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: anip-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: anip-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: anip-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: anip-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: anip-db
          property: password
      - key: REDIS_URL
        fromRedis:
          name: anip-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_API_KEY
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: TWILIO_ACCOUNT_SID
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: TWILIO_AUTH_TOKEN
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: TWILIO_WHATSAPP_NUMBER
        value: "REPLACE_ME_IN_DASHBOARD"

  # Scrapers (Background Worker)
  - type: worker
    name: anip-scrapers
    env: python
    buildCommand: pip install -r backend/scrapers/requirements.txt
    startCommand: python scripts/render_scraper_runner.py
    plan: free
    envVars:
      - key: API_URL
        value: "REPLACE_ME_WITH_API_URL"
      - key: AI_BOT_TOKEN
        value: "anip-ai-bot-secret-2024"
      - key: PYTHONPATH
        value: ".:backend/scrapers"

  # Frontend
  - type: web
    name: anip-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "REPLACE_ME_WITH_API_URL"
