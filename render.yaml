databases:
  - name: anip-db
    databaseName: anip
    user: anip_user
    plan: free

services:
  # Redis
  - type: redis
    name: anip-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

  # Backend (API + Scrapers merged)
  - type: web
    name: anip-api
    env: docker
    dockerContext: .
    dockerfilePath: services/api/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: anip-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: anip-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: anip-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: anip-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: anip-db
          property: password
      - key: REDIS_URL
        fromService:
          name: anip-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_API_KEY
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: TWILIO_ACCOUNT_SID
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: TWILIO_AUTH_TOKEN
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: TWILIO_WHATSAPP_NUMBER
        value: "REPLACE_ME_IN_DASHBOARD"
      - key: RUN_SCRAPERS_IN_BACKGROUND
        value: "true"

  # Frontend
  - type: web
    name: anip-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://anip-api-giq5.onrender.com"
